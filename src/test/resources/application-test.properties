# Test Profile Configuration for PoliclinaBine
# This configuration is automatically activated in tests with @ActiveProfiles("test")

# Application sectionId
spring.application.name=policlicaBine-test

# ===================================================================
# H2 IN-MEMORY DATABASE CONFIGURATION
# ===================================================================
spring.datasource.url=jdbc:h2:mem:testdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 Console (useful for debugging tests)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ===================================================================
# JPA / HIBERNATE CONFIGURATION
# ===================================================================
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.use_sql_comments=false

# Hibernate performance settings for tests
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.jdbc.batch_versioned_data=true

# Timezone configuration for OffsetDateTime support
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# ===================================================================
# JACKSON CONFIGURATION (for OffsetDateTime serialization)
# ===================================================================
# JSON serialization: use UTC timezone (ISO 8601 format is default in Jackson 3)
spring.jackson.time-zone=UTC

# ===================================================================
# LOGGING CONFIGURATION
# ===================================================================
logging.level.root=ERROR
logging.level.com.example.policlicabine=WARN
logging.level.org.springframework.web=ERROR
logging.level.org.springframework.security=ERROR
logging.level.org.hibernate.SQL=ERROR
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=ERROR
logging.level.org.springframework.test=ERROR

# ===================================================================
# JWT CONFIGURATION (Test Keys)
# ===================================================================
# WARNING: These are test-only keys, NOT for production!
jwt.secret=testSecretKeyForJWTTokenGenerationInTestEnvironmentOnly12345678901234567890
jwt.expiration=3600000
jwt.refresh-expiration=86400000

# ===================================================================
# SECURITY CONFIGURATION
# ===================================================================
# Disable security for most tests (can be overridden per test)
spring.security.user.name=test
spring.security.user.password=test
spring.security.user.roles=USER

# ===================================================================
# TEST PERFORMANCE OPTIMIZATIONS
# ===================================================================
# Disable unnecessary features in tests
spring.jmx.enabled=false
spring.main.banner-mode=off
spring.output.ansi.enabled=NEVER

# Fast startup for tests
spring.devtools.restart.enabled=false
spring.devtools.livereload.enabled=false
