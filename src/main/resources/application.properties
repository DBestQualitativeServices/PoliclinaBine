spring.application.name=policlicaBine

spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# ============================================================================
# Timezone Configuration for OffsetDateTime Support
# ============================================================================
# Store all timestamps in UTC timezone in the database
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
# JSON serialization: use UTC timezone (ISO 8601 format is default in Jackson 3)
spring.jackson.time-zone=UTC

spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000

logging.level.root=INFO
logging.level.com.example.policlicabine=INFO
logging.level.org.springframework.web=INFO
logging.level.org.hibernate=WARN

# ============================================================================
# OpenAPI / Swagger Configuration
# ============================================================================
# API documentation paths (always configured)
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.doc-expansion=none
springdoc.swagger-ui.show-common-extensions=true
springdoc.packages-to-scan=com.example.policlicabine.controller
springdoc.api-docs.groups.enabled=true

# Swagger UI enablement (controlled per environment)
# Default: true (dev overrides to true, prod overrides to false)
swagger.enabled=${SWAGGER_ENABLED:true}

# ============================================================================
# JWT Configuration
# ============================================================================
# Secret key for JWT signing (base64 encoded, 256+ bits for HS256)
# Production: Loaded from Azure App Settings environment variable
# Development: Hardcoded in application-dev.properties or environment variable
jwt.secret=${JWT_SECRET:123456789012345678901234567890123456789012345678901234567890123456789012345678901234567890123456789012345678901234567890}
# Access token expiration: 30 minutes (in milliseconds)
jwt.expiration=${JWT_EXPIRATION:1800000}
# Refresh token expiration: 7 days (in milliseconds)
jwt.refresh-expiration=${JWT_REFRESH_EXPIRATION:604800000}

# ============================================================================
# Password Reset Configuration
# ============================================================================
# Password reset token expiration: 1 hour (in milliseconds)
password-reset.token-expiration=3600000

# ============================================================================
# CORS Configuration (Cross-Origin Resource Sharing)
# ============================================================================
# CORS is configured programmatically in CorsConfig.java using these properties
#
# Allowed Origins: Comma-separated list of frontend URLs
# Production: Set via CORS_ALLOWED_ORIGINS environment variable
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}
cors.allowed-methods=GET,POST,PUT,DELETE,PATCH,OPTIONS
cors.allowed-headers=Authorization,Content-Type,Accept,Origin,X-Requested-With
cors.exposed-headers=Authorization
cors.allow-credentials=true
cors.max-age=3600

# ============================================================================
# Spring Boot Actuator Configuration
# ============================================================================
# Enable actuator endpoints
management.endpoints.web.exposure.include=health,info,auditevents
management.endpoint.health.show-details=when-authorized
management.endpoint.auditevents.enabled=true

# Actuator base path
management.endpoints.web.base-path=/actuator

# ============================================================================
# Security Audit Logging Configuration
# ============================================================================
# Enable security audit logging
security.audit.enabled=true

# Async configuration
security.audit.async.enabled=true
security.audit.async.core-pool-size=2
security.audit.async.max-pool-size=5
security.audit.async.queue-capacity=500

# Retention policy (automatic cleanup)
security.audit.retention.enabled=true
security.audit.retention.days=90
security.audit.retention.cron=0 0 2 * * *

# Security alerting
security.audit.alert.enabled=true
security.audit.alert.email=${SECURITY_ALERT_EMAIL:dragosbas@gmail.com}
security.audit.alert.window-minutes=10

# Alert thresholds
security.audit.alert.threshold.failed-logins=5
security.audit.alert.threshold.unauthorized-access=3
security.audit.alert.threshold.token-refresh-failures=2

# ============================================================================
# Scheduled Tasks Configuration
# ============================================================================
spring.task.scheduling.pool.size=2
