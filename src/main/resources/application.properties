spring.application.name=policlicaBine

spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# ============================================================================
# Timezone Configuration for OffsetDateTime Support
# ============================================================================
# Store all timestamps in UTC timezone in the database
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
# JSON serialization: use UTC timezone (ISO 8601 format is default in Jackson 3)
spring.jackson.time-zone=UTC

# ============================================================================
# Virtual Threads Configuration (Spring Boot 4.x Feature - Java 21+)
# ============================================================================
# Enable virtual threads for massive concurrency improvements
# Can handle millions of concurrent requests with minimal overhead
spring.threads.virtual.enabled=true

# ============================================================================
# Problem Details (RFC 7807) for Standardized Error Responses
# ============================================================================
# Enable standardized error response format
spring.mvc.problemdetails.enabled=true

# ============================================================================
# HikariCP Database Connection Pool Configuration
# ============================================================================
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
# Enable HikariCP metrics for monitoring via Actuator
spring.datasource.hikari.register-mbeans=true

logging.level.root=INFO
logging.level.com.example.policlicabine=INFO
logging.level.org.springframework.web=INFO
logging.level.org.hibernate=WARN

# Console logging pattern (removes empty trace ID brackets from Spring Boot 4.0.0-RC1 default)
logging.pattern.console=%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %5p ${PID:- } --- [%15.15t] %-40.40logger{39} : %m%n

# ============================================================================
# OpenAPI / Swagger Configuration
# ============================================================================
# API documentation paths (always configured)
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.doc-expansion=none
springdoc.swagger-ui.show-common-extensions=true
springdoc.packages-to-scan=com.example.policlicabine.controller
springdoc.api-docs.groups.enabled=true

# Swagger UI enablement (controlled per environment)
# Default: true (dev overrides to true, prod overrides to false)
swagger.enabled=${SWAGGER_ENABLED:true}

# Automatic type inference configuration (reduces manual @ApiResponse annotations)
springdoc.default-produces-media-type=application/json
springdoc.default-consumes-media-type=application/json
springdoc.override-with-generic-response=false
springdoc.writer-with-default-pretty-printer=true
springdoc.api-docs.resolve-schema-properties=true

# ============================================================================
# JWT Configuration
# ============================================================================
# Secret key for JWT signing (base64 encoded, 256+ bits for HS256)
# Production: Loaded from Azure App Settings environment variable
# Development: Hardcoded in application-dev.properties or environment variable
jwt.secret=${JWT_SECRET:123456789012345678901234567890123456789012345678901234567890123456789012345678901234567890123456789012345678901234567890}
# Access token expiration: 30 minutes (in milliseconds)
jwt.expiration=${JWT_EXPIRATION:1800000}
# Refresh token expiration: 7 days (in milliseconds)
jwt.refresh-expiration=${JWT_REFRESH_EXPIRATION:604800000}

# ============================================================================
# Password Reset Configuration
# ============================================================================
# Password reset token expiration: 1 hour (in milliseconds)
password-reset.token-expiration=3600000

# ============================================================================
# CORS Configuration (Cross-Origin Resource Sharing)
# ============================================================================
# CORS is configured programmatically in CorsConfig.java using these properties
#
# Allowed Origins: Comma-separated list of frontend URLs
# Production: Set via CORS_ALLOWED_ORIGINS environment variable
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}
cors.allowed-methods=GET,POST,PUT,DELETE,PATCH,OPTIONS
cors.allowed-headers=Authorization,Content-Type,Accept,Origin,X-Requested-With
cors.exposed-headers=Authorization
cors.allow-credentials=true
cors.max-age=3600

# ============================================================================
# Spring Boot Actuator Configuration
# ============================================================================
# Enable actuator endpoints (includes HikariCP metrics)
management.endpoints.web.exposure.include=health,info,auditevents,metrics,prometheus
management.endpoint.health.show-details=when-authorized
management.endpoint.auditevents.enabled=true
management.prometheus.metrics.export.enabled=true

# Actuator base path
management.endpoints.web.base-path=/actuator

# ============================================================================
# Azure Application Insights Configuration
# ============================================================================
# Connection string (set via environment variable in Azure)
# Format: InstrumentationKey=xxx;IngestionEndpoint=https://xxx.in.applicationinsights.azure.com/
# Local development: Leave empty to disable or set manually
applicationinsights.connection.string=${APPLICATIONINSIGHTS_CONNECTION_STRING:}

# Enable/disable Application Insights
applicationinsights.enabled=${APPLICATIONINSIGHTS_ENABLED:true}

# Sampling percentage (100 = capture all, 10 = capture 10%)
applicationinsights.sampling.percentage=${APPLICATIONINSIGHTS_SAMPLING:100}

# Enable live metrics stream (real-time monitoring in Azure Portal)
applicationinsights.preview.live-metrics.enabled=true

# ============================================================================
# Security Audit Logging Configuration
# ============================================================================
# Enable security audit logging
security.audit.enabled=true

# Async configuration
security.audit.async.enabled=true
security.audit.async.core-pool-size=2
security.audit.async.max-pool-size=5
security.audit.async.queue-capacity=500

# Retention policy (automatic cleanup)
security.audit.retention.enabled=true
security.audit.retention.days=90
security.audit.retention.cron=0 0 2 * * *

# Security alerting
security.audit.alert.enabled=true
security.audit.alert.email=${SECURITY_ALERT_EMAIL:dragosbas@gmail.com}
security.audit.alert.window-minutes=10

# Alert thresholds
security.audit.alert.threshold.failed-logins=5
security.audit.alert.threshold.unauthorized-access=3
security.audit.alert.threshold.token-refresh-failures=2

# ============================================================================
# Scheduled Tasks Configuration
# ============================================================================
spring.task.scheduling.pool.size=2

# ============================================================================
# File Storage Configuration
# ============================================================================
# Storage type: LOCAL, AZURE, CLOUDINARY
file.storage.storage-type=${FILE_STORAGE_TYPE:LOCAL}

# Local filesystem storage directory
file.storage.upload-dir=${FILE_UPLOAD_DIR:C:/uploads/policlicabine}

# Maximum file size (supports formats like "25MB", "1GB")
file.storage.max-file-size=25MB

# Allowed MIME types (comma-separated)
file.storage.allowed-mime-types=image/png,image/jpeg,image/jpg

# Base URL for file download links
file.storage.base-url=${FILE_BASE_URL:http://localhost:8080/api/files}

# Azure Blob Storage configuration (used when storage-type=AZURE)
file.storage.azure.connection-string=${AZURE_STORAGE_CONNECTION_STRING:}
file.storage.azure.container-name=${AZURE_STORAGE_CONTAINER:files}
file.storage.azure.sas-expiry-minutes=${AZURE_SAS_EXPIRY_MINUTES:60}

# Cloudinary configuration (used when storage-type=CLOUDINARY)
file.storage.cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
file.storage.cloudinary.api-key=${CLOUDINARY_API_KEY:}
file.storage.cloudinary.api-secret=${CLOUDINARY_API_SECRET:}

# ============================================================================
# Spring Boot Multipart File Upload Configuration
# ============================================================================
# Enable multipart file upload support
spring.servlet.multipart.enabled=true

# Maximum size for a single file
spring.servlet.multipart.max-file-size=25MB

# Maximum size for entire multipart request
spring.servlet.multipart.max-request-size=25MB

# Size threshold after which files are written to disk
spring.servlet.multipart.file-size-threshold=2MB

# Temporary location for file uploads
spring.servlet.multipart.location=${java.io.tmpdir}
