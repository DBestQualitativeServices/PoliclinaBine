spring.application.name=policlicaBine

# Active Profile (default: dev, Azure overrides with SPRING_PROFILES_ACTIVE)
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# Database Configuration (values must be provided via environment variables or profile-specific properties)
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER}
jakarta.persistence.jdbc.url=${spring.datasource.url}

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Connection Pool Settings
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000

# Logging
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# OpenAPI / Swagger Configuration
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.doc-expansion=none
springdoc.swagger-ui.show-common-extensions=true
springdoc.packages-to-scan=com.example.policlicabine.controller
springdoc.api-docs.groups.enabled=true

# JWT Configuration (values must be provided via environment variables or profile-specific properties)
# Secret key for JWT signing (base64 encoded, 256+ bits for HS256)
jwt.secret=${JWT_SECRET}
# Access token expiration: 30 minutes (in milliseconds)
jwt.expiration=${JWT_EXPIRATION}
# Refresh token expiration: 7 days (in milliseconds)
jwt.refresh-expiration=${JWT_REFRESH_EXPIRATION}

# Password Reset Configuration
# Password reset token expiration: 1 hour (in milliseconds)
password-reset.token-expiration=3600000

# ============================================================================
# CORS Configuration (Cross-Origin Resource Sharing)
# ============================================================================
# CORS is configured programmatically in CorsConfig.java
# This section documents property-based configuration as an alternative approach
#
# Current configuration (in CorsConfig.java):
# - Allowed Origins: http://localhost:5173 (development frontend)
# - TODO: Add Azure Static Web App URL when deployed
# - Allowed Methods: GET, POST, PUT, DELETE, PATCH, OPTIONS
# - Credentials: Enabled (for JWT Authorization headers)
#
# Alternative: Uncomment below for property-based CORS configuration
# Note: If using properties, remove or comment the CorsConfig.java bean
#
# Global CORS for Spring MVC:
# spring.web.cors.allowed-origins=http://localhost:5173
# spring.web.cors.allowed-methods=GET,POST,PUT,DELETE,PATCH,OPTIONS
# spring.web.cors.allowed-headers=Authorization,Content-Type,Accept,Origin,X-Requested-With
# spring.web.cors.exposed-headers=Authorization
# spring.web.cors.allow-credentials=true
# spring.web.cors.max-age=3600
#
# TODO: When deploying to Azure, add production URL:
# spring.web.cors.allowed-origins=http://localhost:5173,https://your-app-name.azurestaticapps.net
