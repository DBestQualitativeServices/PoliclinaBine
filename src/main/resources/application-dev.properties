
spring.datasource.url=jdbc:postgresql://dbest-db.postgres.database.azure.com:5432/polbine?sslmode=require
spring.datasource.username=dragos
spring.datasource.password=Robert123

# HikariCP Connection Pool Configuration
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.register-mbeans=true

spring.jpa.hibernate.ddl-auto=update

# Flyway Database Migration
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# Virtual Threads (Spring Boot 4.x)
spring.threads.virtual.enabled=true

# Problem Details (RFC 7807) - Standardized error responses
spring.mvc.problemdetails.enabled=true

# SQL Logging - Single output via logger (fixes duplication)
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# SQL logging - DEBUG level (formatted, single output)
logging.level.org.hibernate.SQL=DEBUG

# Application logging - INFO level (balanced verbosity)
logging.level.com.example.policlicabine=INFO

# Suppress verbose Spring Framework components
logging.level.org.springframework.web=WARN
logging.level.org.springframework.security=WARN
logging.level.org.springframework.boot=INFO
logging.level.org.springframework.data.jpa=WARN

# Reduce Hibernate verbosity
logging.level.org.hibernate.engine=WARN
logging.level.org.hibernate.type=WARN

# Suppress Tomcat access logs
logging.level.org.apache.catalina=WARN
logging.level.org.apache.coyote=WARN

# Reduce HikariCP connection pool noise
logging.level.com.zaxxer.hikari=WARN

# Suppress OpenAPI/Swagger initialization logs
logging.level.org.springdoc=WARN
logging.level.io.swagger=WARN

swagger.enabled=true
springdoc.swagger-ui.enabled=true
springdoc.api-docs.enabled=true

cors.allowed-origins=http://localhost:5173,http://localhost:3000,http://localhost:5174,http://localhost:5175

applicationinsights.connection.string=InstrumentationKey=2149a452-3872-4a02-843b-7664790695e0;IngestionEndpoint=https://westeurope-5.in.applicationinsights.azure.com/;LiveEndpoint=https://westeurope.livediagnostics.monitor.azure.com/;ApplicationId=454aeb75-b210-476f-b946-64656a4b4eb1

# Keep Application Insights enabled but reduce console noise
logging.level.com.microsoft.applicationinsights=ERROR
logging.level.com.azure.core.http.netty=ERROR
logging.level.io.netty=ERROR

# File Storage - Development Configuration
file.storage.storage-type=LOCAL
file.storage.upload-dir=C:/uploads/policlicabine/dev
file.storage.base-url=http://localhost:8080/api/files

# Azure Blob Storage - Development Configuration (when storage-type=AZURE)
file.storage.azure.connection-string=DefaultEndpointsProtocol=https;AccountName=your-dev-account;AccountKey=your-dev-key;EndpointSuffix=core.windows.net
file.storage.azure.container-name=policlica-dev-files
file.storage.azure.sas-expiry-minutes=60

# Disable common development warnings
spring.jpa.open-in-view=false
spring.jmx.enabled=false
springdoc.show-warnings=false