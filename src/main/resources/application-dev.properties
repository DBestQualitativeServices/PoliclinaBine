# ============================================================================
# PoliclicaBine - Development Profile Configuration
# ============================================================================
# This file contains development-specific settings for local development
# IMPORTANT: This file is excluded from git (.gitignore) - DO NOT commit!
#
# Activate this profile:
#   - Maven: mvn spring-boot:run -Dspring-boot.run.profiles=dev
#   - IntelliJ: Set active profile to "dev" in Run Configuration
#   - Default: application.properties uses "dev" by default
# ============================================================================

# ============================================================================
# PostgreSQL Database Configuration (Development)
# ============================================================================
# Use environment variables for security - DO NOT hardcode credentials!
spring.datasource.url=${AZURE_DB_URL:jdbc:postgresql://localhost:5432/policlinica_dev}
spring.datasource.username=${AZURE_DB_USERNAME:postgres}
spring.datasource.password=${AZURE_DB_PASSWORD:changeme}
spring.datasource.driver-class-name=org.postgresql.Driver

# ============================================================================
# JPA/Hibernate Configuration (Development)
# ============================================================================
# Use 'update' for development (auto-creates/updates schema)
spring.jpa.hibernate.ddl-auto=update

# Show SQL queries in console (helpful for debugging)
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ============================================================================
# JWT Configuration (Development)
# ============================================================================
# Development JWT secret (use different secret in production!)
jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B597033733676397924423F4528482B4D6251655468576D5A7134743777217A244326

# Access token expiration: 30 minutes (in milliseconds)
jwt.expiration=1800000

# Refresh token expiration: 7 days (in milliseconds)
jwt.refresh-expiration=604800000

# ============================================================================
# Logging Configuration (Development)
# ============================================================================
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
logging.level.com.example.policlicabine=DEBUG

# ============================================================================
# Development-Specific Settings
# ============================================================================
# Enable Swagger UI in development
springdoc.swagger-ui.enabled=true
